version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: certtrust-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: certtrust
      MONGO_INITDB_ROOT_PASSWORD: certtrust_password
      MONGO_INITDB_DATABASE: certtrust
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - certtrust-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: certtrust-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://certtrust:certtrust_password@mongodb:27017/certtrust?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string-in-production}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@certtrust.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@certtrust.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # HSM Configuration
      HSM_PROVIDER: ${HSM_PROVIDER:-local-fips}
      HSM_CLUSTER_ID: ${HSM_CLUSTER_ID:-}
      HSM_REGION: ${HSM_REGION:-}
    ports:
      - "5000:5000"
    volumes:
      - ../backend:/app
      - /app/node_modules
      - audit_logs:/var/log/certtrust
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - certtrust-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Web Server
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: certtrust-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - certtrust-network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: certtrust-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - certtrust-network
    profiles:
      - production

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: certtrust-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - certtrust-network
    profiles:
      - production
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # HSM Simulator (for testing)
  hsm-simulator:
    build:
      context: .
      dockerfile: Dockerfile.hsm
    container_name: certtrust-hsm-simulator
    restart: unless-stopped
    environment:
      HSM_MODE: simulator
      FIPS_MODE: true
    ports:
      - "9000:9000"
    volumes:
      - hsm_data:/hsm/data
      - audit_logs:/var/log/certtrust
    networks:
      - certtrust-network
    profiles:
      - hsm-testing

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  audit_logs:
    driver: local
  hsm_data:
    driver: local

networks:
  certtrust-network:
    driver: bridge
